# /etc/nginx/sites-available/sgxpressja.com
# Then: ln -s ../sites-available/sgxpressja.com /etc/nginx/sites-enabled/
#       certbot --nginx -d sgxpressja.com -d www.sgxpressja.com   (free HTTPS, auto-renews)

server {
    listen 80;
    server_name sgxpressja.com www.sgxpressja.com;

    # Send www to the main address.
    if ($host = www.sgxpressja.com) {
        return 301 https://sgxpressja.com$request_uri;
    }

    client_max_body_size 8m; # CV uploads on job applications (5 MB max)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build assets have hashed names, so they can be cached for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
