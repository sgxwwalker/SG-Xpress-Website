# /etc/nginx/sites-available/staging.sgxpressja.com
# Then: ln -s ../sites-available/staging.sgxpressja.com /etc/nginx/sites-enabled/
#       certbot --nginx -d staging.sgxpressja.com
# Password-protected so only your team can see it:
#       htpasswd -c /etc/nginx/sgx-staging.htpasswd reviewer

server {
    listen 80;
    server_name staging.sgxpressja.com;

    auth_basic "SG Xpress staging";
    auth_basic_user_file /etc/nginx/sgx-staging.htpasswd;

    # Belt and braces: keep the staging copy out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Browsers must always use HTTPS (takes effect once certbot has added the certificate).
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m; # CV uploads on job applications (5 MB max)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
